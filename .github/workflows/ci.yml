name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test -B

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          if grep -rEn "(sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})" \
             --include="*.java" --include="*.yaml" --include="*.yml" --include="*.properties" \
             --exclude-dir=target --exclude-dir=.git . ; then
            echo "::error::Hardcoded credential pattern detected"
            exit 1
          fi
          echo "No hardcoded secrets detected"

      - name: Verify no tracked env/local config files
        run: |
          if git ls-files | grep -E "^(\.env$|application-local\.ya?ml$)"; then
            echo "::error::A local secrets file is tracked in git"
            exit 1
          fi
          echo "No tracked secrets files"

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check and build
        working-directory: ui
        run: npm run build