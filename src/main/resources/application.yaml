spring:
  application:
    name: sentinel
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: sentinel-incident-processor
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.sentinel.events"
        spring.json.value.default.type: dev.sentinel.events.IncidentCreatedEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: sentinel
sentinel:
  admin-api-key: ${SENTINEL_ADMIN_API_KEY:}
  recurrence:
    threshold-count: ${RECURRENCE_THRESHOLD:3}
    lookback-days: ${RECURRENCE_LOOKBACK_DAYS:30}
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${SENTINEL_LLM_MODEL:claude-haiku-4-5-20251001}
    enabled: ${SENTINEL_LLM_ENABLED:false}